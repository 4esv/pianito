[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# NOTE: musl targets are intentionally excluded. cpal's ALSA backend loads
# `libasound` plugins via dlopen at runtime, and static/musl ALSA builds
# don't support that, so a musl binary would silently lose audio input.
# aarch64-unknown-linux-gnu is deferred too (alsa-sys cross-compile pain);
# see issue #35.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A GitHub repo to push Homebrew formulas to.
#
# NOTE: 4esv/homebrew-tap does not exist yet (tracked in #36). That's fine:
# this only gets pushed to on a tagged release, so committing the config now
# is inert until the tap repo exists and a version tag is pushed.
tap = "4esv/homebrew-tap"

# Linux build-time system dependency: cpal's ALSA backend needs the ALSA
# headers to compile (same package the CI `test`/`msrv` jobs already install
# via apt, see .github/workflows/ci.yml).
[dist.dependencies.apt]
libasound2-dev = { version = "*", stage = ["build"] }

# NOTE(#38 README overhaul): libasound2-dev above is a *build*-time
# dependency baked into the release binary. At *run* time, minimal Linux
# installs (i.e. anything without a desktop environment already pulling it
# in) still need the runtime library: `apt install libasound2`. Every
# desktop distro ships it already, but headless/minimal images don't. This
# belongs in the README's Linux install notes once #38 lands.
